spring:
  application:
    name: referral-platform
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/referral_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USER:referral_user}
    password: ${DATABASE_PASSWORD:referral_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  outbox:
    dispatch-enabled: ${OUTBOX_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${OUTBOX_DISPATCH_INTERVAL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}

logging:
  level:
    com.actpro.referral: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
