  #   environment:
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-referral_platform}
  #     MYSQL_USER: ${MYSQL_USER:-referral_user}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-referral_pass}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     timeout: 5s
  #     retries: 10
  #   networks:
  #     - referral-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: referral-backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
    ports:
      - "8080:8080"
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    networks:
      - referral-network
    restart: unless-stopped

  frontend:
    build:
      context: ./referralPro-dashboard
      dockerfile: Dockerfile
    container_name: referral-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - referral-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  referral-network:
    driver: bridge
