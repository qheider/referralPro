services:
  # Phase 9 hardening: this service was fully commented out while both CLAUDE.md and README.md
  # still documented `docker-compose up -d`/`up -d --build` as the way to get a working MySQL -
  # following either as written left the backend with no database to connect to. Re-enabled with
  # its original 3306:3306 mapping, matching README.md's extensive port table/troubleshooting
  # section (the actually-authoritative source here - CLAUDE.md's "(3307)" parenthetical was
  # corrected to match instead, see that file's history for this same fix). .env.example's
  # DATABASE_URL already points at the in-network service name `mysql:3306` (containers reach each
  # other by service name, not the host-mapped port), so no change needed there.
  mysql:
    image: mysql:8.4
    container_name: referral-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-referral_platform}
      MYSQL_USER: ${MYSQL_USER:-referral_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-referral_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - referral-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: referral-backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - referral-network
    restart: unless-stopped

  frontend:
    build:
      context: ./referralPro-dashboard
      dockerfile: Dockerfile
    container_name: referral-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - referral-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  referral-network:
    driver: bridge
