name: Deploy backend to Elastic Beanstalk (UAT)

# Frontend pushes are handled separately by Amplify's own GitHub integration.
# This only builds/deploys the Spring Boot backend, and only when backend
# files actually changed, so a dashboard-only commit doesn't trigger a
# redeploy.
on:
  push:
    branches: [uat]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'Procfile'
      - '.github/workflows/deploy-backend-uat.yml'

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  EB_APPLICATION_NAME: referralpro-uat
  EB_ENVIRONMENT_NAME: Referralpro-uat-env

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Assemble EB deploy bundle
        run: |
          mkdir -p deploy-bundle
          cp target/referralPro-0.0.1-SNAPSHOT.jar deploy-bundle/
          cp Procfile deploy-bundle/
          cd deploy-bundle
          zip -r ../deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          region: ${{ env.AWS_REGION }}
          version_label: uat-${{ github.sha }}-${{ github.run_number }}
          deployment_package: deploy.zip
