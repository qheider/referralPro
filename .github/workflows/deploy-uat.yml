name: Deploy UAT to Elastic Beanstalk

on:
  push:
    branches:
      - uat
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot application
        run: mvn -B clean package -DskipTests

      - name: Prepare Elastic Beanstalk bundle
        run: |
          mkdir -p deploy-bundle

          JAR=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          echo "Using JAR: $JAR"

          cp "$JAR" deploy-bundle/application.jar

          echo "web: java -jar application.jar" > deploy-bundle/Procfile

          cd deploy-bundle
          zip -r ../referralpro-uat.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create deployment version
        id: version
        run: |
          VERSION="uat-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp referralpro-uat.zip \
            s3://elasticbeanstalk-ca-central-1-418059030774/${{ steps.version.outputs.version }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name referralpro-uat \
            --version-label "${{ steps.version.outputs.version }}" \
            --source-bundle S3Bucket="elasticbeanstalk-ca-central-1-418059030774",S3Key="${{ steps.version.outputs.version }}.zip"

      - name: Deploy to UAT
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name referralpro-uat-env \
            --version-label "${{ steps.version.outputs.version }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name referralpro-uat-env

      - name: Deployment completed
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names referralpro-uat-env \
            --query "Environments[0].[Status,Health,HealthStatus,VersionLabel]" \
            --output table
