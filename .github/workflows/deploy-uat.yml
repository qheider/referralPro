name: Deploy UAT to Elastic Beanstalk

on:
  push:
    branches:
      - uat
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'Procfile'
      - '.github/workflows/deploy-uat.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referralpro-uat-backend
  cancel-in-progress: false

env:
  EB_APPLICATION_NAME: referralpro-uat
  EB_ENVIRONMENT_NAME: referralpro-uat-env
  EB_S3_BUCKET: elasticbeanstalk-ca-central-1-418059030774

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Prepare Elastic Beanstalk bundle
        run: |
          mkdir -p deploy-bundle

          JAR=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No deployable JAR found in target/"
            exit 1
          fi

          echo "Using JAR: $JAR"

          cp "$JAR" deploy-bundle/application.jar

          echo "web: java -jar application.jar" > deploy-bundle/Procfile

          cd deploy-bundle
          zip -r ../referralpro-uat.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create deployment version
        id: version
        run: |
          VERSION="uat-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp referralpro-uat.zip \
            "s3://${EB_S3_BUCKET}/${{ steps.version.outputs.version }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${{ steps.version.outputs.version }}" \
            --source-bundle S3Bucket="${EB_S3_BUCKET}",S3Key="${{ steps.version.outputs.version }}.zip"

      - name: Deploy to UAT
        run: |
          # Environment properties override application.yml defaults. Preserve any
          # additional origins already configured while ensuring the dashboard works.
          aws elasticbeanstalk describe-configuration-settings \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:application:environment' && OptionName=='CORS_ALLOWED_ORIGINS'].Value" \
            --output json > cors-current.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          existing = json.loads(Path("cors-current.json").read_text())
          origins = [origin.strip() for value in existing for origin in value.split(",") if origin.strip()]
          dashboard_origin = "https://referral.luupnow.ca"
          if dashboard_origin not in origins:
              origins.append(dashboard_origin)
          options = [{
              "Namespace": "aws:elasticbeanstalk:application:environment",
              "OptionName": "CORS_ALLOWED_ORIGINS",
              "Value": ",".join(origins),
          }, {
              "Namespace": "aws:elasticbeanstalk:application:environment",
              "OptionName": "APP_FRONTEND_URL",
              "Value": dashboard_origin,
          }]
          Path("cors-options.json").write_text(json.dumps(options))
          PY

          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${{ steps.version.outputs.version }}" \
            --option-settings file://cors-options.json

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "${EB_ENVIRONMENT_NAME}"

      - name: Verify deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --query "Environments[0].[Status,Health,HealthStatus,VersionLabel]" \
            --output table

      - name: Verify live registration CORS
        run: |
          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 \
            --dump-header cors-response.headers \
            --output cors-response.body \
            --request OPTIONS \
            --header 'Origin: https://referral.luupnow.ca' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,authorization' \
            'https://api-uat.referral.actpro.ai/api/companies/register'

          python3 - <<'PY'
          from pathlib import Path

          headers = {}
          for line in Path("cors-response.headers").read_text().splitlines():
              if line.startswith("HTTP/"):
                  headers = {}
              elif ":" in line:
                  name, value = line.split(":", 1)
                  headers[name.lower()] = value.strip()
          assert headers.get("access-control-allow-origin") == "https://referral.luupnow.ca", "Dashboard origin missing from live CORS response"
          assert "POST" in {item.strip() for item in headers.get("access-control-allow-methods", "").split(",")}, "Registration POST is not allowed"
          allowed = {item.strip().lower() for item in headers.get("access-control-allow-headers", "").split(",")}
          assert {"content-type", "authorization"} <= allowed, "Registration request headers are not allowed"
          print("Live registration preflight passed")
          PY
